# vim: syntax=yaml textwidth=120 expandtab tabstop=2 softtabstop=2 shiftwidth=2 autoindent
# Docker compose setting up a standalone XTB service on a local docker host.configs:
# NOTE: Source the ENV defining the secret first or define them inline (SSH_KEY, PKI_PASSPHRASE, STATECACHE_PASS)

networks:
  trustbroker-network:
    external: false

services:
  postgresql:
    container_name: postgresql
    restart: on-failure
    image: docker.io/library/postgres:18
    volumes:
      - ./postgresql:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tbss16
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=${STATECACHE_PASS}
    networks:
      - trustbroker-network

  mariadb:
    container_name: mariadb
    restart: on-failure
    image: docker.io/library/mariadb:12-ubi
    volumes:
      - ./mariadb:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=TBSS16
      - MYSQL_ROOT_PASSWORD=${STATECACHE_PASS}
      - MYSQL_PASSWORD=${STATECACHE_PASS}
      - MYSQL_USER=trustbroker
    networks:
      - trustbroker-network

  gitea:
    container_name: gitea
    restart: on-failure
    image: docker.io/gitea/gitea:1.21.5
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ./gitea:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    networks:
      - trustbroker-network

  ldap1:
    container_name: ldap1
    image: osixia/openldap:latest
    ports:
      - '1389:389'
      - '636:636'
    command: --copy-service -l debug
    environment:
      - LDAP_TLS=false
      - LDAP_BASE_DN=dc=trustbroker,dc=ch
      - LDAP_ORGANISATION=Trustbroker
      - LDAP_DOMAIN=trustbroker.ch
      - LDAP_ADMIN_PASSWORD=secret
      - LDAP_CONFIG_PASSWORD=secret
      - KEEP_EXISTING_CONFIG=false
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=false
      - LDAP_LOG_LEVEL=64
    volumes:
      - ./ldap_init/schema:/container/service/slapd/assets/config/bootstrap/schema/custom
      - ./ldap_init/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - trustbroker-network

  ldap2:
    container_name: ldap2
    image: osixia/openldap:latest
    ports:
      - '1390:389'
      - '637:636'
    command: --copy-service -l debug
    environment:
      - LDAP_TLS=false
      - LDAP_BASE_DN=dc=trustbroker2,dc=ch
      - LDAP_ORGANISATION=Trustbroker2
      - LDAP_DOMAIN=trustbroker2.ch
      - LDAP_ADMIN_PASSWORD=secret
      - LDAP_CONFIG_PASSWORD=secret
      - KEEP_EXISTING_CONFIG=false
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=false
      - LDAP_LOG_LEVEL=64
    volumes:
      - ./ldap2_init/schema:/container/service/slapd/assets/config/bootstrap/schema/custom
      - ./ldap2_init/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ldap2_data:/var/lib/ldap
      - ldap2_config:/etc/ldap/slapd.d
    networks:
      - trustbroker-network

  # http://localhost:8099
  # ldap1 loginDN: cn=admin,dc=trustbroker,dc=ch   password: secret
  # ldap2 loginDN: cn=admin,dc=trustbroker2,dc=ch  password: secret
  phpldapadmin:
    image: osixia/phpldapadmin:stable
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_HTTPS=false
      - PHPLDAPADMIN_LDAP_HOSTS=ldap1,ldap2
    ports:
      - '8099:80'
    depends_on:
      - ldap1
      - ldap2
    networks:
      - trustbroker-network

  trustbroker:
    container_name: trustbroker
    image: ghcr.io/trustbroker-swiss/trustbroker-application:latest
    user: "${UID}:${GID}"
    depends_on:
      - gitea
      - postgresql
      - ldap1
      - ldap2
    volumes:
      - ./ssh:/etc/trustbroker/keys:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      - GIT_URL=${GIT_URL}
      - GIT_TOKEN=${GIT_TOKEN}
      - SSH_KEY=${SSH_KEY}
      - CONFIG_BRANCH=main
      - SPRING_PROFILES_ACTIVE=DEMO
      - PKI_PASSPHRASE=${PKI_PASSPHRASE}
      - SPRING_FLYWAY_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration/postgresql
      - SPRING_FLYWAY_SCHEMAS=tbss16
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgresql:5432/tbss16
      - SPRING_FLYWAY_USER=root
      - SPRING_FLYWAY_PASSWORD=${STATECACHE_PASS}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/tbss16?currentSchema=tbss16
      - SPRING_DATASOURCE_USERNAME=trustbroker
      - SPRING_DATASOURCE_PASSWORD=${STATECACHE_PASS}
      #
      # martiadb support
      #- SPRING_FLYWAY_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      #- SPRING_FLYWAY_LOCATIONS=classpath:db/migration/mariadb
      #- SPRING_FLYWAY_URL=jdbc:mariadb://mariadb:5432
      #- SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:5432/tbss16
      #
      # Debug SSH startup in case of connectivity problem with external git repo
      #- LOGGING_LEVEL_ROOT=DEBUG
      #
      # When running behind an enterprise proxy inject a HTTPS or SSH proxy (HTTP not supported)
      #- HTTPS_PROXY=http://proxy.company.com:1234
      #- SSH_PROXY_HOST=proxy.company.com
      #- SSH_PROXY_PORT=1234
      #
      # When running on HTTP relax cookie polices
      - TRUSTBROKER_CONFIG_SECUREBROWSERHEADERS=false
    networks:
      - trustbroker-network

  samlmock:
    container_name: samlmock
    image: ghcr.io/trustbroker-swiss/trustbroker-samlmock:latest
    depends_on:
      - gitea
    volumes:
      - ./ssh:/etc/trustbroker/keys:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "7070:7070"
      - "7071:7071"
    environment:
      - GIT_URL=${GIT_URL}
      - GIT_TOKEN=${GIT_TOKEN}
      - SSH_KEY=${SSH_KEY}
      - CONFIG_BRANCH=main
      - SPRING_PROFILES_ACTIVE=DEMO
      - PKI_PASSPHRASE=${PKI_PASSPHRASE}
    networks:
      - trustbroker-network

volumes:
  ldap_data:
  ldap_config:
  ldap2_data:
  ldap2_config:
