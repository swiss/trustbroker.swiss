plugins {
	id 'java-library'
	id 'jacoco'
}

dependencies {
	// components
	implementation project("${rootProject.top}:trustbroker-api")
	implementation project("${rootProject.top}:trustbroker-common")
	implementation project("${rootProject.top}:trustbroker-service")
	testImplementation project("${rootProject.top}:trustbroker-test")

	// spring-boot baseline
	implementation "org.springframework.boot:spring-boot-starter-web"

	// ldap connectivity wired explicitly in MultiLdapConfig
	implementation "org.springframework.ldap:spring-ldap-core"
	// LDAP connection pooling (PooledContextSource); commons-pool2 is only an optional dep of spring-ldap-core
	implementation "org.apache.commons:commons-pool2"

	// spring-test baseline
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

publishing {
	publications {
		docJar(MavenPublication) {
			artifact tasks.named('javadocjar')
		}
	}
}

artifactoryPublish {
	publications(publishing.publications.docJar)
}
